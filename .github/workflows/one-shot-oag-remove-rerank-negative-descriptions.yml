name: one-shot-oag-remove-rerank-negative-descriptions
"on":
  push:
    branches:
      - docs/oag-ch5-llm-seed-rerank-prompt
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/oag-ch5-llm-seed-rerank-prompt
      - name: Update design doc
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("docs/OAG本体锚点语义检索与向量索引设计方案.md")
          s = p.read_text(encoding="utf-8")
          a = "精排 Prompt **不接收**以下上下文：\n\n```text\nskill_context\nGraph Hint\nValue Supporting Evidence\nrrfScore\nchannelHits\nsupporting_hits\nmatched_field\nmatched_value\n```\n\n这些内容不属于当前精排模型输入协议，LLM 不应依赖未传递的信息进行判断。\n\n"
          b = "LLM 不负责：\n\n```text\n创造新 ID\n重新打分\n重新做 RRF\n重新做 OpenSearch / GaussVector 检索\n调用图算法\n生成 nGQL / Cypher / OQL\n```\n\n"
          assert s.count(a) == 1, s.count(a)
          assert s.count(b) == 1, s.count(b)
          s = s.replace(a, "").replace(b, "")
          p.write_text(s, encoding="utf-8")
          PY
          rm .github/workflows/one-shot-oag-remove-rerank-negative-descriptions.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: simplify rerank design descriptions"
          git push
