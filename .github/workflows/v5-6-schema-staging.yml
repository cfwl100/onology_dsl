name: V5.6 schema staging

on:
  push:
    branches:
      - agent/v5-6-schema-staging
    paths:
      - .github/workflows/v5-6-schema-staging.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and verify V5.6 from zstd delta
        run: |
          target="docs/OAG本体锚点语义检索与向量索引设计方案.md"
          cp "$target" /tmp/v55.md
          cat .v56delta/part_*.b64 | base64 -d > /tmp/v56.delta.zst
          zstd -q -d --patch-from=/tmp/v55.md /tmp/v56.delta.zst -o /tmp/v56.md
          actual_sha=$(git hash-object /tmp/v56.md)
          expected_sha="2c3d315890210c5fb3731f1762a6716697ad608f"
          test "$actual_sha" = "$expected_sha"
          mv /tmp/v56.md "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "生成V5.6索引结构设计文档"
          git push
