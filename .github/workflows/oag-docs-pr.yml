name: OAG docs PR patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.event.pull_request.head.ref == 'docs/oag-subgraph-complete-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/oag-subgraph-complete-20260823
          fetch-depth: 0
      - name: Extract and run patch logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/oag-docs-merge.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i,l in enumerate(src) if "python - <<'PY'" in l) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          body = []
          for line in src[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/patch_oag_docs.py').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          python /tmp/patch_oag_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/OAG语义子图检索接口extractedEntities结构设计方案.md docs/OAG本体锚点语义检索与向量索引设计方案.md
          if git diff --cached --quiet; then
            echo "No documentation changes"
            exit 0
          fi
          git commit -m "docs: complete OAG subgraph retrieval design"
          git push origin HEAD:docs/oag-subgraph-complete-20260823
