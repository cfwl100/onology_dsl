name: V5.11 synonym flat index

on:
  push:
    branches:
      - agent/v511-synonym-flat-index

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/v511-synonym-flat-index
          path: source
          fetch-depth: 0

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          path: target
          fetch-depth: 0

      - name: Guard chapter 2 baseline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          base_sha = 'c3cd7e4bf592ad8329ba457667b76d0d76218ba8'
          doc = 'docs/OAG本体锚点语义检索与向量索引设计方案.md'
          current = Path('target') / doc
          current_text = current.read_text(encoding='utf-8')
          base_text = subprocess.check_output(
              ['git', '-C', 'target', 'show', f'{base_sha}:{doc}'],
              text=True,
              encoding='utf-8',
          )

          def chapter2(t: str) -> str:
              return t.split('# 2. 数据模型与索引结构', 1)[1].split('# 3. 索引构建与 DataSync Bulk Import', 1)[0]

          if chapter2(current_text) != chapter2(base_text):
              raise SystemExit('chapter 2 changed on main after V5.11 baseline; refuse to overwrite concurrent chapter-2 edits')
          print('chapter 2 baseline unchanged')
          PY

      - name: Patch latest main document
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/.automation/v511/patch.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '不再使用 `synonyms.*.keyword` 或语言 dynamic object。',
              '不再使用按语言展开的 keyword 子字段或语言 dynamic object。'
          )
          s = s.replace("    'synonyms.*.keyword',\n", '')
          p.write_text(s, encoding='utf-8')
          PY
          python3 source/.automation/v511/patch.py \
            'target/docs/OAG本体锚点语义检索与向量索引设计方案.md'

      - name: Verify diff scope and contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('target/docs/OAG本体锚点语义检索与向量索引设计方案.md')
          t = p.read_text(encoding='utf-8')
          ch2 = t.split('# 2. 数据模型与索引结构', 1)[1].split('# 3. 索引构建与 DataSync Bulk Import', 1)[0]
          assert '> 版本：V5.11' in t
          assert 'OAG `synonyms`：统一平铺为 String/TEXT' in ch2
          assert 'synonym_line_analyzer' in ch2
          assert 'synonyms.*.keyword' not in ch2
          assert '{synonyms_value}' not in ch2
          assert '{synonyms_description}' not in ch2
          assert 'matched_field = synonyms.<language>' not in t
          assert '"matched_field": "synonyms.zh"' not in t
          assert '"matched_field": "synonyms.es"' not in t
          print('V5.11 contract validation passed')
          PY
          cd target
          changed="$(git diff --name-only)"
          printf 'changed files:\n%s\n' "$changed"
          test "$changed" = 'docs/OAG本体锚点语义检索与向量索引设计方案.md'

      - name: Commit and push main
        shell: bash
        run: |
          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'docs/OAG本体锚点语义检索与向量索引设计方案.md'
          git commit -m '统一第2章Synonym平铺索引结构与检索方案'
          git push origin HEAD:main
