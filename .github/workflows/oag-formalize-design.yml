name: OAG formal design cleanup

on:
  push:
    branches:
      - docs/oag-subgraph-complete-20260823

permissions:
  contents: write

jobs:
  formalize-oag-design:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/oag-subgraph-complete-20260823
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Formalize design document
        run: python3 tools/formalize_oag_design.py

      - name: Validate formal document
        run: |
          DOC='docs/OAG本体锚点语义检索与向量索引设计方案.md'
          grep -q '^# OAG 本体锚点语义检索与向量索引设计方案$' "$DOC"
          grep -q '### 2.6 `t_oag_enum_{ontology_id}` Enum Value' "$DOC"
          grep -q '| `display_lang_2` | `VARCHAR(512 CHAR)`' "$DOC"
          grep -q '| `description_lang_2` | `TEXT`' "$DOC"
          grep -q '| `synonyms` | `TEXT` |  | 实例值同义词' "$DOC"
          grep -q 'semanticExtensions.valueMappings' "$DOC"
          ! grep -q 'PR #42' "$DOC"
          ! grep -q 'V5.16 完整详细设计' "$DOC"
          ! grep -q 'V5.17 规范收敛' "$DOC"
          ! grep -q '^# 8. 全量信息覆盖与维护原则' "$DOC"

      - name: Remove one-shot helpers
        run: |
          rm -f tools/formalize_oag_design.py
          rm -f .github/workflows/oag-formalize-design.yml
          rm -f .github/oag-formalize-trigger.txt

      - name: Commit final document
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: formalize OAG design and expand enum language fields'
          git push origin HEAD:docs/oag-subgraph-complete-20260823
