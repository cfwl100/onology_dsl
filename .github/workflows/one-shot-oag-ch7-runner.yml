name: one-shot-oag-ch7-runner
on:
  push:
    branches:
      - docs/oag-ch7-performance-config-eval-restructure
    paths:
      - .github/workflows/one-shot-oag-ch7-runner.yml
permissions:
  contents: write
jobs:
  update-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/oag-ch7-performance-config-eval-restructure
      - run: python3 scripts/tmp_restructure_oag_ch7.py
      - run: rm -f scripts/tmp_restructure_oag_ch7.py .github/workflows/one-shot-oag-ch7-restructure.yml .github/workflows/one-shot-oag-ch7-runner.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/OAG本体锚点语义检索与向量索引设计方案.md scripts/tmp_restructure_oag_ch7.py .github/workflows/one-shot-oag-ch7-restructure.yml .github/workflows/one-shot-oag-ch7-runner.yml
          git commit -m "docs: reorganize chapter 7 performance and evaluation design"
          git push
