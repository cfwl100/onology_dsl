name: V5.12 chapter3 TODO resolution

on:
  push:
    branches:
      - agent/v512-ch3-todo-retry-retention

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/v512-ch3-todo-retry-retention
          path: source
          fetch-depth: 0

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          path: target
          fetch-depth: 0

      - name: Guard chapter 3 baseline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          base_sha = '4c17d2b316f9d6a2d9cf48b32bd08d8e33fc9680'
          doc = 'docs/OAG本体锚点语义检索与向量索引设计方案.md'
          current = (Path('target') / doc).read_text(encoding='utf-8')
          base = subprocess.check_output(
              ['git', '-C', 'target', 'show', f'{base_sha}:{doc}'],
              text=True,
              encoding='utf-8',
          )

          def chapter3(t: str) -> str:
              return t.split('# 3. 索引构建与入库', 1)[1].split('# 4. Query Understanding 与 6 路召回', 1)[0]

          if chapter3(current) != chapter3(base):
              raise SystemExit('chapter 3 changed on main after V5.12 baseline; refuse to overwrite concurrent chapter-3 edits')
          print('chapter 3 baseline unchanged')
          PY

      - name: Normalize retired retry field wording in patch source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/.automation/v512/patch.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'OAG 不再持久化或返回 `retryable`。': 'OAG 不再持久化或返回服务端布尔重试标记。',
              'OAG **不再根据错误码返回或维护 `retryable`**。': 'OAG **不再根据错误码返回或维护服务端布尔重试标记**。',
              'OAG 不再输出 `retryable`；': 'OAG 不再输出服务端布尔重试标记；',
              '不是服务端 `retryable` 判定': '不是服务端布尔重试判定',
              'OAG 不再返回 `retryable`。': 'OAG 不再返回服务端布尔重试标记。',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Patch latest main document
        shell: bash
        run: |
          python3 source/.automation/v512/patch.py \
            'target/docs/OAG本体锚点语义检索与向量索引设计方案.md'

      - name: Verify diff scope and contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('target/docs/OAG本体锚点语义检索与向量索引设计方案.md')
          t = p.read_text(encoding='utf-8')
          ch3 = t.split('# 3. 索引构建与入库', 1)[1].split('# 4. Query Understanding 与 6 路召回', 1)[0]

          assert '> 版本：V5.12' in t
          assert 'TODO' not in ch3
          assert 'retryable' not in ch3
          assert 'ERROR_CODE_LIST' in ch3
          assert 'FILE_LIST' in ch3
          assert 'ERR_FILE_LIST' in ch3
          assert 'FILE_RETENTION_UNTIL' in ch3
          assert 'sourceFileMaxRetentionDays=30' in ch3
          assert '生产者负责业务删除 + MinIO Lifecycle 硬 TTL 兜底 + OAG 只读消费' in ch3
          assert '| `propertyid`' in ch3
          assert '| `objectTypeId`' in ch3
          print('V5.12 contract validation passed')
          PY

          cd target
          changed="$(git -c core.quotePath=false diff --name-only)"
          printf 'changed files:\n%s\n' "$changed"
          test "$changed" = 'docs/OAG本体锚点语义检索与向量索引设计方案.md'

      - name: Commit and push main
        shell: bash
        run: |
          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'docs/OAG本体锚点语义检索与向量索引设计方案.md'
          git commit -m '落实第3章任务重试与MinIO文件老化TODO'
          git push origin HEAD:main
