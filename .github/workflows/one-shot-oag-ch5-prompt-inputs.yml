name: one-shot-oag-ch5-prompt-inputs

on:
  push:
    branches:
      - docs/oag-ch5-llm-seed-rerank-prompt
    paths:
      - tools/update_oag_ch5_prompt_inputs.py
      - .github/workflows/one-shot-oag-ch5-prompt-inputs.yml

permissions:
  contents: write

jobs:
  update-doc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/oag-ch5-llm-seed-rerank-prompt
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update chapter 5
        run: python tools/update_oag_ch5_prompt_inputs.py
      - name: Validate and commit
        run: |
          test ! -e tools/update_oag_ch5_prompt_inputs.py
          test ! -e .github/workflows/one-shot-oag-ch5-prompt-inputs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: simplify LLM rerank prompt inputs'
          git push origin HEAD:docs/oag-ch5-llm-seed-rerank-prompt
