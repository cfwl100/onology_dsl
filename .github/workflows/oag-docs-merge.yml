          main = main.replace('4. Query Understanding 与 6 路召回', '4. 实体提取、Entity Linking 与 6 路召回', 1)
          main = main.replace('6. 种子节点投影与本体子图构建', '6. 本体对象投影、子图策略、路径探测与 nGQL 生成', 1)

          # TODO 1: logical terminology.
          main = sub_once(
              r'OAG 同时承担索引构建、语义检索和本体子图构建三类能力。V5\.7 进一步收敛检索数据模型，只保留三个业务层次：\s*TODO : 种子节点 统一 改为 本体对象，元数据元素当前只有枚举值，统一改为 枚举元素，实例元素继续保留。\s*```text\s*种子节点（Seed Node）\s*= ObjectType / Property\s*元数据元素（Metadata Element）\s*= Enum Value\s*实例元素（Instance Element）\s*= 真实 Instance Value\s*```',
