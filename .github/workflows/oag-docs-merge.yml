name: OAG docs cleanup

on:
  push:
    branches:
      - docs/oag-subgraph-complete-20260823

permissions:
  contents: write

jobs:
  cleanup-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/oag-subgraph-complete-20260823
          fetch-depth: 0

      - name: Cleanup OAG design terminology
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('docs/OAG本体锚点语义检索与向量索引设计方案.md')
          extracted_path = Path('docs/OAG语义子图检索接口extractedEntities结构设计方案.md')
          text = main_path.read_text(encoding='utf-8')

          replacements = [
              ('# OAG 面向本体本体对象的语义检索、混合排序与本体子图构建设计方案', '# OAG 面向本体对象的语义检索、混合排序与本体子图构建设计方案'),
              ('本体本体对象 Resolver', '本体对象 Resolver'),
              ('| enum元素 | Enum Value', '| 枚举元素 | Enum Value'),
              ('| enum元素 | `t_oag_enum_{ontology_id}`', '| 枚举元素 | `t_oag_enum_{ontology_id}`'),
              ('## 2.13 Metadata / Instance OpenSearch Index', '## 2.13 Enum / Instance OpenSearch Index'),
              ('Metadata 的 `synonyms` 映射', '枚举元素的 `synonyms` 映射'),
              ('本体对象 / Metadata 语义元素：', '本体对象 / 枚举元素：'),
              ('Metadata 与 Instance 分表的一个核心原因', '枚举元素与实例元素分表的一个核心原因'),
              ('枚举语义元素', '枚举元素'),
              ('Metadata 语义元素', '枚举元素'),
              ('Instance 语义元素', '实例元素'),
              ('1. seed_lexical\n2. seed_dense\n3. metadata_lexical\n4. metadata_dense\n5. instance_lexical\n6. instance_dense',
               '1. ontology_object_lexical\n2. ontology_object_dense\n3. enum_lexical\n4. enum_dense\n5. instance_lexical\n6. instance_dense'),
              ('Seed Lexical\nSeed Dense\nMetadata Lexical\nMetadata Dense\nInstance Lexical\nInstance Dense',
               'Ontology Object Lexical\nOntology Object Dense\nEnum Lexical\nEnum Dense\nInstance Lexical\nInstance Dense'),
              ('RRF(seed) = Σ weight(channel) / (rrf_k + rank_channel(seed))',
               'RRF(candidate) = Σ weight(channel) / (rrf_k + rank_channel(candidate))'),
              ('seed.topK\nmetadata.topK\ninstance.topK', 'ontologyObject.topK\nenum.topK\ninstance.topK'),
          ]
          for old, new in replacements:
              text = text.replace(old, new)

          # Recommended semanticRetrieval config names. Legacy seed/metadata identifiers remain only in compatibility/API contexts.
          text = text.replace('''  seed:\n    topK: 10\n    similarityThreshold: 0.6\n\n  metadata:\n    topK: 10\n    similarityThreshold: 0.6\n\n  instance:''',
                              '''  ontologyObject:\n    topK: 10\n    similarityThreshold: 0.6\n\n  enum:\n    topK: 10\n    similarityThreshold: 0.6\n\n  instance:''')
          text = text.replace('''    seed:\n      topK: 10\n      similarityThreshold: 0.6\n\n    metadata:\n      topK: 10\n      similarityThreshold: 0.6\n\n    instance:''',
                              '''    ontologyObject:\n      topK: 10\n      similarityThreshold: 0.6\n\n    enum:\n      topK: 10\n      similarityThreshold: 0.6\n\n    instance:''')

          if 'TODO' in text:
              raise RuntimeError('main design still contains TODO')
          if '本体本体对象' in text:
              raise RuntimeError('duplicate ontology-object wording remains')

          extracted = extracted_path.read_text(encoding='utf-8')
          if 'TODO' in extracted:
              raise RuntimeError('extractedEntities design still contains TODO')

          main_path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/OAG本体锚点语义检索与向量索引设计方案.md docs/OAG语义子图检索接口extractedEntities结构设计方案.md
          if git diff --cached --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git commit -m "docs: normalize OAG retrieval terminology"
          git push origin HEAD:docs/oag-subgraph-complete-20260823
