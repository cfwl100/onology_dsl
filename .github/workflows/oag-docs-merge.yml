name: OAG docs final validation

on:
  push:
    branches:
      - docs/oag-subgraph-complete-20260823

permissions:
  contents: write

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/oag-subgraph-complete-20260823
          fetch-depth: 0

      - name: Fix OpenAPI formatting and validate TODOs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('docs/OAG本体锚点语义检索与向量索引设计方案.md')
          extracted_path = Path('docs/OAG语义子图检索接口extractedEntities结构设计方案.md')

          extracted = extracted_path.read_text(encoding='utf-8')
          start_marker = '## 10. OpenAPI Schema 核心定义\n\n'
          end_marker = '\n---\n\n## 11. 兼容迁移策略'
          start = extracted.index(start_marker)
          end = extracted.index(end_marker, start)

          lines = [
              '## 10. OpenAPI Schema 核心定义',
              '',
              '```yaml',
              'components:',
              '  schemas:',
              '    SemanticSearchRequest:',
              '      type: object',
              '      anyOf:',
              '        - required: [query]',
              '        - required: [extractedEntities]',
              '      properties:',
              '        query:',
              '          type: string',
              '          minLength: 1',
              '          maxLength: 1024',
              '        searchContext:',
              '          type: string',
              '          minLength: 1',
              '          maxLength: 32768',
              '        extractedEntities:',
              '          type: array',
              '          minItems: 1',
              '          items:',
              "            $ref: '#/components/schemas/ExtractedEntity'",
              '        adaptiveRetrieval:',
              '          type: integer',
              '          default: 1',
              '          enum: [0, 1]',
              '        seedRetrievalMode:',
              '          type: string',
              '          default: vector',
              '          enum: [vector, keyword, hybrid]',
              '        similarityThreshold:',
              '          type: number',
              '          minimum: 0',
              '          maximum: 1',
              '          default: 0.6',
              '        topk:',
              '          type: integer',
              '          minimum: 1',
              '          default: 3',
              '        graphExpansionStrategy:',
              '          type: string',
              '          default: minimal',
              '          enum: [minimal, khop, component]',
              '        hopLimit:',
              '          type: integer',
              '          minimum: 1',
              '          default: 3',
              '        includeFunctions:',
              '          type: integer',
              '          default: 0',
              '          enum: [0, 1]',
              '        includeActions:',
              '          type: integer',
              '          default: 0',
              '          enum: [0, 1]',
              '',
              '    ExtractedEntity:',
              '      type: object',
              '      description: 仅允许 ObjectType、Properties、Values 三个顶层业务字段',
              '      anyOf:',
              '        - required: [ObjectType]',
              '        - required: [Values]',
              '          properties:',
              '            Values:',
              '              minItems: 1',
              '      properties:',
              '        ObjectType:',
              '          type: string',
              '          minLength: 1',
              '        Properties:',
              '          type: array',
              '          default: []',
              '          items:',
              '            type: string',
              '            minLength: 1',
              '        Values:',
              '          type: array',
              '          default: []',
              '          items:',
              "            $ref: '#/components/schemas/ValueHint'",
              '      additionalProperties: false',
              '',
              '    ValueHint:',
              '      type: object',
              '      required: [Value]',
              '      properties:',
              '        Property:',
              '          type: string',
              '          minLength: 1',
              '        Value:',
              '          type: string',
              '          minLength: 1',
              '      additionalProperties: false',
              '```',
              '',
              '`Properties → ObjectType` 和 `ValueHint.Property → Properties` 的交叉字段约束由服务端 Validator 执行。',
          ]
          section = '\n'.join(lines) + '\n'
          extracted = extracted[:start] + section + extracted[end:]
          extracted_path.write_text(extracted, encoding='utf-8')

          main = main_path.read_text(encoding='utf-8')
          checks = {
              'main TODO': 'TODO' not in main,
              'duplicate wording': '本体本体对象' not in main,
              'five-step entity extraction': '① 实体提取' in main,
              'five-step entity linking': '② 实体链接' in main,
              'subgraph strategy': '③ 子图检索策略' in main,
              'nGQL stage': '④ nGQL' in main,
              'result generation': '⑤ 结果生成' in main,
              'PathProbePlan': 'PathProbePlan' in main,
              'weighted RRF example': 'Weighted RRF 执行样例' in main,
          }
          extracted_checks = {
              'extracted TODO': 'TODO' not in extracted,
              'ObjectType field': '`ObjectType`' in extracted,
              'Properties field': '`Properties`' in extracted,
              'Values field': '`Values`' in extracted,
              'old Relationships field removed': '`Relationships`' not in extracted,
              'old EnumValues field removed': '`EnumValues`' not in extracted,
              'old InstanceValues field removed': '`InstanceValues`' not in extracted,
          }
          failed = [k for k, ok in {**checks, **extracted_checks}.items() if not ok]
          if failed:
              raise RuntimeError('validation failed: ' + ', '.join(failed))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/OAG语义子图检索接口extractedEntities结构设计方案.md docs/OAG本体锚点语义检索与向量索引设计方案.md
          if git diff --cached --quiet; then
            echo "No final changes"
            exit 0
          fi
          git commit -m "docs: fix extractedEntities OpenAPI formatting"
          git push origin HEAD:docs/oag-subgraph-complete-20260823
