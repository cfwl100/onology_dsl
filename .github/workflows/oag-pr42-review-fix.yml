### 数据源接入模式、容量规格与 DataSeek 对齐结论

OAG 增加服务端配置项，配置的是“**由谁负责读取业务数据**”，而不是“是否使用 MinIO”。动态 Enum/Instance 数据的交付通道统一为 MinIO：

