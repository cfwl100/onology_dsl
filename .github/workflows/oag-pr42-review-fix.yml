| 模式 | 数据流 | 适用场景 |
|---|---|---|
| `OAC` | Build API → OAG → OAC 抽取 → MinIO → notice → OAG 读取 → Embedding → 双写 | 部署中 OAC 可以访问业务数据源；首次全量和后续更新均适用，不区分数据量 |
| `BUSINESS_NOTICE` | DataSync/业务服务抽取 → MinIO → notice → OAG 读取 → Embedding → 双写 | OAC 不可对接业务数据源，或业务已有独立数据同步服务 |

