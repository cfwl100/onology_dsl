name: Merge entity prompt into extractedEntities design

on:
  push:
    branches:
      - docs/oag-merge-entity-prompt

permissions:
  contents: write

jobs:
  merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: docs/oag-merge-entity-prompt
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge prompt into design
        run: python3 tools/merge_entity_prompt_into_design.py

      - name: Validate merged document
        run: |
          DOC='docs/OAG语义子图检索接口extractedEntities结构设计方案.md'
          grep -q '^> 文档版本：V2.5' "$DOC"
          grep -q '^## 12. LLM 实体提取 Prompt（正式）$' "$DOC"
          grep -q '^### 12.2 中文版完整 Prompt$' "$DOC"
          grep -q '^### 12.3 English Version Prompt$' "$DOC"
          grep -q '^## 13. 最终设计决策$' "$DOC"
          grep -q 'ValueHint.Property' "$DOC"
          grep -q 'value-only' "$DOC"
          test ! -e 'docs/OAG实体提取LLM提示词.md'

      - name: Remove one-shot helpers
        run: |
          rm -f tools/merge_entity_prompt_into_design.py
          rm -f .github/workflows/merge-entity-prompt-into-design.yml

      - name: Commit merged design
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'docs: merge LLM entity extraction prompt into extractedEntities design'
          git push origin HEAD:docs/oag-merge-entity-prompt
