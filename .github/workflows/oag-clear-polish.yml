name: Polish OAG CLEAR semantics

on:
  push:
    branches:
      - docs/oag-clear-ch4-restructure

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/oag-clear-ch4-restructure
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Polish CLEAR semantics
        run: python3 tools/polish_oag_clear_semantics.py

      - name: Validate final document
        run: |
          DOC='docs/OAG本体锚点语义检索与向量索引设计方案.md'
          grep -q '清理当前本体全量实例索引' "$DOC"
          grep -q 'importMode=CLEAR' "$DOC"
          grep -q '^## 4.7 本章输出与第 5 章衔接$' "$DOC"
          ! grep -q '^## 4.0 核心设计$' "$DOC"
          ! grep -q '^## 4.1 详细设计与实现$' "$DOC"

      - name: Remove one-shot helpers
        run: |
          rm -f tools/polish_oag_clear_semantics.py
          rm -f .github/workflows/oag-clear-polish.yml

      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.whitespace -trailing-space
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'docs: align CLEAR semantics across index management chapter'
          git push origin HEAD:docs/oag-clear-ch4-restructure
