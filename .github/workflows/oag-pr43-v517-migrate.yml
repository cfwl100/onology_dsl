name: OAG PR43 V5.17 migrate

on:
  pull_request_target:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/oag-subgraph-complete-20260823'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply deterministic V5.17 migration
        run: python3 tools/oag_v517_patch.py
      - name: Remove temporary migration helpers from PR branch
        run: |
          rm -f tools/oag_v517_patch.py
          rm -f .github/workflows/oag-v517-inline-merge.yml
          rm -f .github/oag-v517-trigger.txt
      - name: Commit migrated design
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'docs: inline V5.17 rules and finalize semantic extensions'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
