name: one-shot-oag-ch5-rerank

on:
  push:
    branches:
      - docs/oag-ch5-llm-seed-rerank-prompt
    paths:
      - tools/update_oag_chapter5_llm_rerank.py
      - .github/workflows/one-shot-oag-ch5-rerank.yml

permissions:
  contents: write

jobs:
  update-doc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/oag-ch5-llm-seed-rerank-prompt
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update chapter 5
        run: python tools/update_oag_chapter5_llm_rerank.py
      - name: Validate and commit
        run: |
          test ! -e tools/update_oag_chapter5_llm_rerank.py
          test ! -e .github/workflows/one-shot-oag-ch5-rerank.yml
          grep -q '## 5.2 多上下文联合精排设计' 'docs/OAG本体锚点语义检索与向量索引设计方案.md'
          grep -q '### 5.5.1 中文版 Prompt' 'docs/OAG本体锚点语义检索与向量索引设计方案.md'
          grep -q '### 5.5.2 English Prompt' 'docs/OAG本体锚点语义检索与向量索引设计方案.md'
          grep -q '{{skill_context}}' 'docs/OAG本体锚点语义检索与向量索引设计方案.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: add LLM seed rerank prompts and context pruning design'
          git push origin HEAD:docs/oag-ch5-llm-seed-rerank-prompt
