name: Update OAG SearchContext V2.6

on:
  push:
    branches:
      - docs/oag-search-context-structure-v26

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/oag-search-context-structure-v26
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update SearchContext schema and document
        run: python3 tools/update_search_context_v26.py

      - name: Validate document
        run: |
          DOC='docs/OAG语义子图检索接口extractedEntities结构设计方案.md'
          grep -q '^> 文档版本：V2.6' "$DOC"
          grep -q '^### 3.3 SearchContext$' "$DOC"
          grep -q 'target_entity' "$DOC"
          grep -q 'search_path' "$DOC"
          grep -q 'extensions' "$DOC"
          grep -q 'Step1 Entity Extraction Prompt v0.15' "$DOC"
          grep -q 'ID(xxx),BillingAccount,Invoice,BillDetail' "$DOC"
          grep -q 'Subscriber(id:{msisdn}) -\[:HAS_SUBSCRIPTION\]-> SubscribeRelation -\[:SUBSCRIBE_TO\]-> Offering' "$DOC"

      - name: Remove one-shot helpers
        run: |
          rm -f tools/update_search_context_v26.py
          rm -f .github/workflows/oag-search-context-v26.yml

      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'docs: structure SearchContext with target entity and search path'
          git push origin HEAD:docs/oag-search-context-structure-v26
