name: Polish OAG chapter 3

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/oag-chapter3-restructure
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Polish chapter 3
        run: python3 tools/polish_oag_chapter3.py
      - name: Remove helpers and commit
        run: |
          rm -f tools/polish_oag_chapter3.py
          rm -f .github/workflows/oag-chapter3-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.whitespace -trailing-space
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'docs: polish OAG index task and file recovery semantics'
          git push origin HEAD:docs/oag-chapter3-restructure
