name: OAG restore original document title

on:
  push:
    branches:
      - docs/oag-subgraph-complete-20260823
    paths:
      - .github/oag-restore-title-trigger.txt

permissions:
  contents: write

jobs:
  rename-title:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/oag-subgraph-complete-20260823
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore original document title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/OAG本体锚点语义检索与向量索引设计方案.md')
          text = p.read_text(encoding='utf-8')
          old = '# OAG 本体语义索引管理和语义检索'
          new = '# OAG 本体锚点语义检索与向量索引设计方案'
          if not text.startswith(old + '\n'):
              raise SystemExit('unexpected document title')
          p.write_text(new + text[len(old):], encoding='utf-8')
          PY
      - name: Remove one-shot helper files
        run: |
          rm -f .github/workflows/oag-restore-original-title.yml
          rm -f .github/oag-restore-title-trigger.txt
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: restore original OAG design document title'
          git push origin HEAD:docs/oag-subgraph-complete-20260823
