name: OAG V5.17 inline merge

on:
  push:
    branches:
      - 'docs/oag-subgraph-complete-20260823'

permissions:
  contents: write

jobs:
  merge-design:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
