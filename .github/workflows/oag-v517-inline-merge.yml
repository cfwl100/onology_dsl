百万/千万级 CSV 必须流式处理；Software 小文件也复用同一实现，只是 Chunk 数量更少：

```text
MinIO InputStream → CSV Streaming Parser → Chunk → Normalize/Dedup → Embedding Batch → Storage Bulk Batch
