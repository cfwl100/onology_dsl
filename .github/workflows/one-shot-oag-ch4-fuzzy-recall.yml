name: one-shot-oag-ch4-fuzzy-recall

on:
  push:
    branches:
      - docs/oag-ch4-fuzzy-hybrid-recall
    paths:
      - tools/update_oag_chapter4_fuzzy_recall.py
      - .github/workflows/one-shot-oag-ch4-fuzzy-recall.yml

permissions:
  contents: write

jobs:
  update-doc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/oag-ch4-fuzzy-hybrid-recall
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update chapter 4
        run: python tools/update_oag_chapter4_fuzzy_recall.py
      - name: Validate and commit
        run: |
          test ! -e tools/update_oag_chapter4_fuzzy_recall.py
          test ! -e .github/workflows/one-shot-oag-ch4-fuzzy-recall.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: refine chapter 4 fuzzy hybrid recall routing'
          git push origin HEAD:docs/oag-ch4-fuzzy-hybrid-recall
