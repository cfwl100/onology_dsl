[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oac-osdk"
version = "0.2.0"
description = "Python OSDK client for Java-based OAC service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["sdk/python"]
addopts = "-q"
